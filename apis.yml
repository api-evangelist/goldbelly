aid: goldbelly
name: Goldbelly
description: >-
  Goldbelly is a curated online marketplace for gourmet food and food gifts,
  shipping America's most iconic and legendary regional foods, restaurant dishes,
  and desserts nationwide directly to consumers' doors. The platform connects
  hundreds of independent restaurants, bakeries, food artisans, and specialty
  makers with customers through a consumer e-commerce storefront, gift and
  corporate-gifting programs, subscriptions, and gift cards. Goldbelly is a
  consumer marketplace and does not currently publish a public developer API,
  SDK, or developer portal; this API Evangelist profile captures its public
  web, help, seller, and policy surfaces. Backed by Y Combinator.
